<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
    </head>
    <body>
        <img id="image" src="jslogo.png" width="120" height="100">
        <script>
            var flag = false;
            function changeImage() {
                if (flag == false) {
                    document.getElementById("image").src = "jslogo2.jpg";
                    flag = true;
                } else {
                    document.getElementById("image").src = "jslogo.png";
                    flag = false;
                }
            }
        </script>
        <input type="button" onclick="changeImage()" value="click!"/>
    </body>
</html>
